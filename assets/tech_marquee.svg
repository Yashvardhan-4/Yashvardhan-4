<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" width="100%" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      
      .pill {
        rx: 8px;
        ry: 8px;
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
        transition: all 0.3s;
      }
      
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #e6edf3;
      }

      .pill-icon {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
      }
      
      .track {
        display: flex;
        animation: scroll 22s linear infinite;
      }
      
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-960px); }
      }

      .fade-left {
        fill: url(#fadeL);
      }
      .fade-right {
        fill: url(#fadeR);
      }
    </style>
    
    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <!-- Marquee Group Definition -->
    <g id="techGroup">
      <!-- TypeScript -->
      <g transform="translate(10, 25)">
        <rect width="130" height="40" class="pill" stroke="#3178C6" stroke-opacity="0.4" />
        <circle cx="26" cy="20" r="5" fill="#3178C6" />
        <text x="42" y="25" class="pill-text">TypeScript</text>
      </g>
      <!-- React 19 -->
      <g transform="translate(155, 25)">
        <rect width="120" height="40" class="pill" stroke="#61DAFB" stroke-opacity="0.4" />
        <circle cx="26" cy="20" r="5" fill="#61DAFB" />
        <text x="42" y="25" class="pill-text">React 19</text>
      </g>
      <!-- Next.js 16 -->
      <g transform="translate(290, 25)">
        <rect width="125" height="40" class="pill" stroke="#ffffff" stroke-opacity="0.3" />
        <circle cx="26" cy="20" r="5" fill="#ffffff" />
        <text x="42" y="25" class="pill-text">Next.js 16</text>
      </g>
      <!-- Three.js -->
      <g transform="translate(430, 25)">
        <rect width="120" height="40" class="pill" stroke="#a855f7" stroke-opacity="0.4" />
        <circle cx="26" cy="20" r="5" fill="#a855f7" />
        <text x="42" y="25" class="pill-text">Three.js</text>
      </g>
      <!-- C++ -->
      <g transform="translate(565, 25)">
        <rect width="100" height="40" class="pill" stroke="#00599C" stroke-opacity="0.4" />
        <circle cx="26" cy="20" r="5" fill="#00599C" />
        <text x="42" y="25" class="pill-text">C++</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(680, 25)">
        <rect width="135" height="40" class="pill" stroke="#336791" stroke-opacity="0.4" />
        <circle cx="26" cy="20" r="5" fill="#336791" />
        <text x="42" y="25" class="pill-text">PostgreSQL</text>
      </g>
      <!-- Electron -->
      <g transform="translate(830, 25)">
        <rect width="120" height="40" class="pill" stroke="#47848F" stroke-opacity="0.4" />
        <circle cx="26" cy="20" r="5" fill="#47848F" />
        <text x="42" y="25" class="pill-text">Electron</text>
      </g>
    </g>
  </defs>

  <rect width="960" height="90" fill="#0d1117" />

  <g class="track">
    <use href="#techGroup" x="0" />
    <use href="#techGroup" x="960" />
    <use href="#techGroup" x="1920" />
  </g>

  <!-- Left & Right Edge Fades for Seamless Infinite Loop -->
  <rect x="0" y="0" width="80" height="90" class="fade-left" pointer-events="none" />
  <rect x="880" y="0" width="80" height="90" class="fade-right" pointer-events="none" />
</svg>
