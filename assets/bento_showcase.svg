<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');

      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      .card-bg { fill: #0D0F12; stroke: #1F242D; stroke-width: 1; rx: 14px; }
      .inner-pane { fill: #12151B; stroke: #1C222C; stroke-width: 1; rx: 8px; }

      .card-title { font-size: 13px; font-weight: 700; fill: #F4F4F6; letter-spacing: 0.04em; text-transform: uppercase; }
      .card-sub { font-size: 11.5px; font-weight: 500; fill: #7E8494; }

      .badge { fill: #161A22; stroke: #262E3D; stroke-width: 1; rx: 4px; }
      .badge-text { font-size: 10px; font-weight: 600; fill: #A5ABB9; }

      .accent-blue { fill: #455CE9; }
      .accent-emerald { fill: #10B981; }
      .accent-purple { fill: #8B5CF6; }

      .active-pill-emerald { fill: rgba(16, 185, 129, 0.12); stroke: rgba(16, 185, 129, 0.35); stroke-width: 1; rx: 10px; }
      .active-pill-blue { fill: rgba(69, 92, 233, 0.12); stroke: rgba(69, 92, 233, 0.35); stroke-width: 1; rx: 10px; }
      .active-pill-purple { fill: rgba(139, 92, 246, 0.12); stroke: rgba(139, 92, 246, 0.35); stroke-width: 1; rx: 10px; }
    </style>
  </defs>

  <!-- ==================== CARD 1: 3D SPATIAL & WEBGL ENGINE ==================== -->
  <g transform="translate(0, 0)">
    <rect class="card-bg" width="450" height="230" />
    
    <g transform="translate(20, 22)">
      <circle cx="6" cy="6" r="4" fill="#455CE9" />
      <text class="font-mono card-title" x="18" y="10">3D Spatial &amp; WebGL Engine</text>
      <text class="font-sans card-sub" x="0" y="30">Shivkush Hi-Tech Nursery • Interactive Viewport</text>
    </g>

    <!-- Visual UI Viewport Mockup -->
    <g transform="translate(20, 62)">
      <rect class="inner-pane" width="410" height="116" />
      
      <!-- Viewport Header -->
      <line x1="0" y1="24" x2="410" y2="24" stroke="#1C222C" stroke-width="1" />
      <text class="font-mono" x="12" y="16" font-size="9px" fill="#7E8494">VIEWPORT: 3D CANVAS</text>
      <text class="font-mono" x="330" y="16" font-size="9.5px" fill="#10B981" font-weight="600">● 60.0 FPS</text>

      <!-- 3D Wireframe Geometry Mockup -->
      <g transform="translate(85, 68)">
        <!-- Isometric Box Wireframe -->
        <polygon points="0,-28 32,-12 32,24 0,8" fill="rgba(69, 92, 233, 0.08)" stroke="#455CE9" stroke-width="1.2" />
        <polygon points="0,-28 -32,-12 -32,24 0,8" fill="rgba(69, 92, 233, 0.15)" stroke="#455CE9" stroke-width="1.2" />
        <polygon points="0,8 32,-8 0,-24 -32,-8" fill="rgba(69, 92, 233, 0.22)" stroke="#5871FF" stroke-width="1.2" />
        
        <!-- Vertex Nodes -->
        <circle cx="0" cy="-28" r="2.5" fill="#FFFFFF" />
        <circle cx="32" cy="-12" r="2.5" fill="#5871FF" />
        <circle cx="-32" cy="-12" r="2.5" fill="#5871FF" />
        <circle cx="0" cy="8" r="2.5" fill="#FFFFFF" />
      </g>

      <!-- Viewport Sliders Telemetry -->
      <g transform="translate(200, 38)">
        <text class="font-mono" x="0" y="15" font-size="10px" fill="#7E8494">Pitch / Yaw: <tspan fill="#F4F4F6">42° / 118°</tspan></text>
        <line x1="0" y1="24" x2="190" y2="24" stroke="#1F242D" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="24" x2="120" y2="24" stroke="#455CE9" stroke-width="3" stroke-linecap="round" />
        <circle cx="120" cy="24" r="4" fill="#FFFFFF" />

        <text class="font-mono" x="0" y="48" font-size="10px" fill="#7E8494">Mesh Density: <tspan fill="#F4F4F6">24.5k Polys</tspan></text>
        <line x1="0" y1="56" x2="190" y2="56" stroke="#1F242D" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="56" x2="155" y2="56" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
        <circle cx="155" cy="56" r="4" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Tech Badges Footer -->
    <g transform="translate(20, 192)">
      <rect class="badge" x="0" y="0" width="70" height="22" /><text class="font-mono badge-text" x="11" y="15">Three.js</text>
      <rect class="badge" x="78" y="0" width="60" height="22" /><text class="font-mono badge-text" x="11" y="15">WebGL</text>
      <rect class="badge" x="146" y="0" width="85" height="22" /><text class="font-mono badge-text" x="11" y="15">Canvas API</text>
      <rect class="badge" x="239" y="0" width="50" height="22" /><text class="font-mono badge-text" x="12" y="15">PWA</text>
    </g>
  </g>

  <!-- ==================== CARD 2: REALTIME RELATIONAL BACKEND ==================== -->
  <g transform="translate(470, 0)">
    <rect class="card-bg" width="450" height="230" />
    
    <g transform="translate(20, 22)">
      <circle cx="6" cy="6" r="4" fill="#10B981" />
      <text class="font-mono card-title" x="18" y="10">Realtime Relational Backend</text>
      <text class="font-sans card-sub" x="0" y="30">Supabase PostgreSQL • Row-Level Security (RLS)</text>
    </g>

    <!-- Visual UI Database Stream Mockup -->
    <g transform="translate(20, 62)">
      <rect class="inner-pane" width="410" height="116" />
      
      <!-- Security Status Bar -->
      <line x1="0" y1="24" x2="410" y2="24" stroke="#1C222C" stroke-width="1" />
      <text class="font-mono" x="12" y="16" font-size="9px" fill="#7E8494">LIVE TRANSACTION STREAM</text>
      <g transform="translate(270, 4)">
        <rect class="active-pill-emerald" width="130" height="16" />
        <text class="font-mono" x="10" y="12" font-size="8.5px" fill="#10B981" font-weight="600">● RLS: ENFORCED</text>
      </g>

      <!-- Transaction Rows -->
      <g transform="translate(12, 34)">
        <!-- Row 1 -->
        <text class="font-mono" x="0" y="14" font-size="10px" fill="#E1E4EA">ORD-9821</text>
        <text class="font-mono" x="90" y="14" font-size="10px" fill="#7E8494">Nursery Checkout</text>
        <rect class="active-pill-emerald" x="280" y="3" width="90" height="15" />
        <text class="font-mono" x="290" y="14" font-size="8.5px" fill="#10B981" font-weight="600">CONFIRMED</text>

        <!-- Row 2 -->
        <text class="font-mono" x="0" y="38" font-size="10px" fill="#E1E4EA">ORD-9822</text>
        <text class="font-mono" x="90" y="38" font-size="10px" fill="#7E8494">Inventory Update</text>
        <rect class="active-pill-blue" x="280" y="27" width="90" height="15" />
        <text class="font-mono" x="288" y="38" font-size="8.5px" fill="#455CE9" font-weight="600">DISPATCHED</text>

        <!-- Row 3 -->
        <text class="font-mono" x="0" y="62" font-size="10px" fill="#E1E4EA">ORD-9823</text>
        <text class="font-mono" x="90" y="62" font-size="10px" fill="#7E8494">Cart Live Session</text>
        <rect class="active-pill-purple" x="280" y="51" width="90" height="15" />
        <text class="font-mono" x="304" y="62" font-size="8.5px" fill="#8B5CF6" font-weight="600">SYNCED</text>
      </g>
    </g>

    <!-- Tech Badges Footer -->
    <g transform="translate(20, 192)">
      <rect class="badge" x="0" y="0" width="75" height="22" /><text class="font-mono badge-text" x="11" y="15">Supabase</text>
      <rect class="badge" x="83" y="0" width="85" height="22" /><text class="font-mono badge-text" x="11" y="15">PostgreSQL</text>
      <rect class="badge" x="176" y="0" width="105" height="22" /><text class="font-mono badge-text" x="11" y="15">RLS Security</text>
      <rect class="badge" x="289" y="0" width="80" height="22" /><text class="font-mono badge-text" x="11" y="15">REST APIs</text>
    </g>
  </g>

  <!-- ==================== CARD 3: ALGORITHMIC GRAPH TOPOLOGY ==================== -->
  <g transform="translate(0, 250)">
    <rect class="card-bg" width="450" height="230" />
    
    <g transform="translate(20, 22)">
      <circle cx="6" cy="6" r="4" fill="#8B5CF6" />
      <text class="font-mono card-title" x="18" y="10">Algorithmic Graph Topology</text>
      <text class="font-sans card-sub" x="0" y="30">IIT NPTEL Silver (77%) • 500+ Solved Challenges</text>
    </g>

    <!-- Visual UI Graph Canvas Mockup -->
    <g transform="translate(20, 62)">
      <rect class="inner-pane" width="410" height="116" />
      
      <!-- Header -->
      <line x1="0" y1="24" x2="410" y2="24" stroke="#1C222C" stroke-width="1" />
      <text class="font-mono" x="12" y="16" font-size="9px" fill="#7E8494">SHORTEST PATH DISCOVERY</text>
      <text class="font-mono" x="248" y="16" font-size="9.5px" fill="#455CE9" font-weight="600">COST: 9 • O(E log V)</text>

      <!-- Network Nodes & Edges -->
      <g transform="translate(20, 25)">
        <!-- Edges (Inactive) -->
        <line x1="40" y1="40" x2="130" y2="70" stroke="#1E2430" stroke-width="1.5" />
        <line x1="130" y1="70" x2="250" y2="70" stroke="#1E2430" stroke-width="1.5" />
        <line x1="220" y1="20" x2="330" y2="45" stroke="#1E2430" stroke-width="1.5" />

        <!-- Shortest Path Highlight (Active Traversal) -->
        <line x1="40" y1="40" x2="130" y2="20" stroke="#455CE9" stroke-width="2.5" />
        <line x1="130" y1="20" x2="220" y2="20" stroke="#455CE9" stroke-width="2.5" />
        <line x1="220" y1="20" x2="330" y2="45" stroke="#10B981" stroke-width="2.5" />

        <!-- Nodes -->
        <!-- Node A (Source) -->
        <circle cx="40" cy="40" r="12" fill="#141822" stroke="#455CE9" stroke-width="2" />
        <text class="font-mono" x="40" y="44" font-size="10px" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text>

        <!-- Node B -->
        <circle cx="130" cy="20" r="12" fill="#141822" stroke="#455CE9" stroke-width="2" />
        <text class="font-mono" x="130" y="24" font-size="10px" fill="#FFFFFF" text-anchor="middle" font-weight="700">B</text>

        <!-- Node C -->
        <circle cx="130" cy="70" r="10" fill="#12151B" stroke="#252D3C" stroke-width="1.5" />
        <text class="font-mono" x="130" y="74" font-size="9px" fill="#7E8494" text-anchor="middle">C</text>

        <!-- Node D -->
        <circle cx="220" cy="20" r="12" fill="#141822" stroke="#455CE9" stroke-width="2" />
        <text class="font-mono" x="220" y="24" font-size="10px" fill="#FFFFFF" text-anchor="middle" font-weight="700">D</text>

        <!-- Node E -->
        <circle cx="250" cy="70" r="10" fill="#12151B" stroke="#252D3C" stroke-width="1.5" />
        <text class="font-mono" x="250" y="74" font-size="9px" fill="#7E8494" text-anchor="middle">E</text>

        <!-- Node F (Target / Sink) -->
        <circle cx="330" cy="45" r="13" fill="#141822" stroke="#10B981" stroke-width="2.5" />
        <text class="font-mono" x="330" y="49" font-size="11px" fill="#10B981" text-anchor="middle" font-weight="800">F</text>
      </g>
    </g>

    <!-- Tech Badges Footer -->
    <g transform="translate(20, 192)">
      <rect class="badge" x="0" y="0" width="85" height="22" /><text class="font-mono badge-text" x="11" y="15">Graph Theory</text>
      <rect class="badge" x="93" y="0" width="95" height="22" /><text class="font-mono badge-text" x="11" y="15">Max-Flow / Cut</text>
      <rect class="badge" x="196" y="0" width="60" height="22" /><text class="font-mono badge-text" x="11" y="15">C++20</text>
      <rect class="badge" x="264" y="0" width="105" height="22" /><text class="font-mono badge-text" x="11" y="15">Dynamic Prog</text>
    </g>
  </g>

  <!-- ==================== CARD 4: PREDICTIVE ML PIPELINE ==================== -->
  <g transform="translate(470, 250)">
    <rect class="card-bg" width="450" height="230" />
    
    <g transform="translate(20, 22)">
      <circle cx="6" cy="6" r="4" fill="#38BDF8" />
      <text class="font-mono card-title" x="18" y="10">Predictive ML Valuation Engine</text>
      <text class="font-sans card-sub" x="0" y="30">Venture Valuation Predictor • Regression Pipeline</text>
    </g>

    <!-- Visual UI Chart Mockup -->
    <g transform="translate(20, 62)">
      <rect class="inner-pane" width="410" height="116" />
      
      <!-- Chart Header -->
      <line x1="0" y1="24" x2="410" y2="24" stroke="#1C222C" stroke-width="1" />
      <text class="font-mono" x="12" y="16" font-size="9px" fill="#7E8494">VALUATION TRAJECTORY CURVE</text>
      <text class="font-mono" x="270" y="16" font-size="9.5px" fill="#38BDF8" font-weight="600">R² = 0.912 • MAE 4.8%</text>

      <!-- Regression Chart Graphics -->
      <g transform="translate(25, 26)">
        <!-- Grid lines -->
        <line x1="0" y1="20" x2="360" y2="20" stroke="#19202A" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="45" x2="360" y2="45" stroke="#19202A" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="70" x2="360" y2="70" stroke="#19202A" stroke-width="1" stroke-dasharray="3 3" />

        <!-- Confidence Area -->
        <path d="M 10 70 Q 120 62 200 40 T 350 10 L 350 25 Q 200 55 120 72 T 10 78 Z" fill="rgba(56, 189, 248, 0.12)" />

        <!-- Main Regression Curve -->
        <path d="M 10 74 Q 120 64 200 45 T 350 15" stroke="#38BDF8" stroke-width="2.5" fill="none" />

        <!-- Scatter Points (Historical Venture Rounds) -->
        <circle cx="35" cy="72" r="3" fill="#A5ABB9" />
        <circle cx="85" cy="62" r="3" fill="#A5ABB9" />
        <circle cx="140" cy="58" r="3" fill="#38BDF8" />
        <circle cx="195" cy="42" r="3.5" fill="#FFFFFF" />
        <circle cx="260" cy="38" r="3" fill="#38BDF8" />
        <circle cx="310" cy="22" r="3.5" fill="#FFFFFF" />
        <circle cx="345" cy="16" r="4" fill="#10B981" />
      </g>
    </g>

    <!-- Tech Badges Footer -->
    <g transform="translate(20, 192)">
      <rect class="badge" x="0" y="0" width="85" height="22" /><text class="font-mono badge-text" x="11" y="15">Scikit-Learn</text>
      <rect class="badge" x="93" y="0" width="65" height="22" /><text class="font-mono badge-text" x="11" y="15">Pandas</text>
      <rect class="badge" x="166" y="0" width="75" height="22" /><text class="font-mono badge-text" x="11" y="15">Python 3</text>
      <rect class="badge" x="249" y="0" width="95" height="22" /><text class="font-mono badge-text" x="11" y="15">Regression</text>
    </g>
  </g>
</svg>
