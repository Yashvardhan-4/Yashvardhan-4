<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      
      .bg { fill: #0C0D0E; stroke: #22252B; stroke-width: 1; rx: 12px; }
      .pill-bg { fill: #141518; stroke: #22252B; stroke-width: 1; rx: 14px; }
      .status-dot { fill: #10B981; }
      .status-ring { stroke: #10B981; stroke-width: 1.5; animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: 52px 38px; }
      
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      
      .pill-text { fill: #8C9099; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; }
      .accent-text { fill: #455CE9; font-weight: 600; }
      
      .hero-name { font-size: 38px; font-weight: 800; fill: #F4F4F6; letter-spacing: -0.03em; }
      .hero-role { font-size: 15px; font-weight: 600; fill: #455CE9; letter-spacing: 0.08em; text-transform: uppercase; }
      .hero-desc { font-size: 14px; font-weight: 400; fill: #8C9099; line-height: 1.5; }
      .hero-desc-highlight { fill: #D1D5DB; font-weight: 500; }
      
      .meta-item { fill: #6B7280; font-size: 12px; }
      .meta-val { fill: #F4F4F6; font-weight: 600; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0; transform: scale(2.2); }
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Top Status Pill -->
  <g transform="translate(36, 26)">
    <rect class="pill-bg" width="370" height="28" />
    <circle class="status-ring" cx="16" cy="14" r="5" fill="none" />
    <circle class="status-dot" cx="16" cy="14" r="3" />
    <text class="font-mono pill-text" x="30" y="18">PUNE, INDIA <tspan fill="#4B5563">•</tspan> PCCOE CE '28 <tspan class="accent-text">[CGPA 8.86]</tspan></text>
  </g>

  <!-- Availability Indicator -->
  <g transform="translate(620, 26)">
    <rect class="pill-bg" width="244" height="28" />
    <circle cx="16" cy="14" r="3" fill="#455CE9" />
    <text class="font-mono pill-text" x="30" y="18">OPEN FOR HIGH-IMPACT ROLES</text>
  </g>

  <!-- Hairline Divider -->
  <line x1="36" y1="72" x2="864" y2="72" stroke="#22252B" stroke-width="1" />

  <!-- Main Hero Identity -->
  <text class="font-sans hero-name" x="36" y="122">Yashvardhan Borude</text>
  <text class="font-mono hero-role" x="36" y="148">Full Stack Software Engineer &amp; Algorithmic Specialist</text>
  
  <text class="font-sans hero-desc" x="36" y="182">
    Architecting production-grade web systems with <tspan class="hero-desc-highlight">Supabase, PostgreSQL, and Three.js</tspan>.
  </text>
  <text class="font-sans hero-desc" x="36" y="202">
    Merging rigorous backend integrity with interactive spatial design and competitive algorithmic discipline.
  </text>

  <!-- Minimal Decorative Hairline Accent -->
  <line x1="820" y1="120" x2="864" y2="120" stroke="#455CE9" stroke-width="2" stroke-linecap="round" />
  <line x1="844" y1="130" x2="864" y2="130" stroke="#22252B" stroke-width="2" stroke-linecap="round" />
</svg>
