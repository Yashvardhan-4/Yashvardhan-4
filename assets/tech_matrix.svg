<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      
      .bg-panel {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1px;
        rx: 12px;
        ry: 12px;
      }
      
      .col-box {
        fill: #161b22;
        stroke: #21262d;
        stroke-width: 1px;
        rx: 8px;
        ry: 8px;
      }
      
      .col-title {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .tech-item {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #e6edf3;
      }

      .tech-sub {
        font-family: 'Fira Code', monospace;
        font-size: 10px;
        fill: #7d8590;
      }

      .dot-cyan { fill: #00E5FF; }
      .dot-purple { fill: #c084fc; }
      .dot-emerald { fill: #34d399; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect x="4" y="4" width="912" height="172" class="bg-panel" />

  <!-- Section Header -->
  <g transform="translate(24, 28)">
    <circle cx="0" cy="0" r="3.5" fill="#00E5FF" />
    <text x="12" y="4" font-family="'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#8b949e" text-transform="uppercase">
      TECHNICAL ARSENAL // CORE SYSTEMS &amp; CAPABILITIES
    </text>
  </g>

  <!-- Column 1: Core Languages (x=24, w=275) -->
  <g transform="translate(24, 45)">
    <rect width="275" height="115" class="col-box" />
    <g transform="translate(16, 22)">
      <circle cx="0" cy="0" r="3" class="dot-cyan" />
      <text x="10" y="4" class="col-title" fill="#00E5FF">LANGUAGES &amp; RUNTIMES</text>
      
      <text x="0" y="32" class="tech-item">C++ · TypeScript · JavaScript</text>
      <text x="0" y="52" class="tech-item">Python · SQL · HTML5 / Modern CSS</text>
      
      <text x="0" y="76" class="tech-sub">&gt; Algorithmic DSA · Low-level rigor</text>
    </g>
  </g>

  <!-- Column 2: Frontend & Spatial (x=315, w=285) -->
  <g transform="translate(315, 45)">
    <rect width="285" height="115" class="col-box" />
    <g transform="translate(16, 22)">
      <circle cx="0" cy="0" r="3" class="dot-purple" />
      <text x="10" y="4" class="col-title" fill="#c084fc">FRONTEND &amp; SPATIAL 3D</text>
      
      <text x="0" y="32" class="tech-item">React 19 · Next.js (App Router)</text>
      <text x="0" y="52" class="tech-item">Three.js · WebGL · Tailwind CSS</text>
      
      <text x="0" y="76" class="tech-sub">&gt; 120 FPS graphics · Draco 3D mesh</text>
    </g>
  </g>

  <!-- Column 3: Backend & Systems (x=616, w=280) -->
  <g transform="translate(616, 45)">
    <rect width="280" height="115" class="col-box" />
    <g transform="translate(16, 22)">
      <circle cx="0" cy="0" r="3" class="dot-emerald" />
      <text x="10" y="4" class="col-title" fill="#34d399">SYSTEMS, DATA &amp; APPS</text>
      
      <text x="0" y="32" class="tech-item">PostgreSQL · Supabase RLS</text>
      <text x="0" y="52" class="tech-item">Electron · Chrome MV3 · Docker</text>
      
      <text x="0" y="76" class="tech-sub">&gt; IndexedDB sync · Parallel streams</text>
    </g>
  </g>
</svg>
