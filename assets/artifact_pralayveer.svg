<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="170" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .font-mono { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #525866; letter-spacing: 0.14em; text-transform: uppercase; }
      .bg { fill: #07080A; stroke: #181D26; stroke-width: 1; rx: 12px; }
      .contour { stroke: #151A24; stroke-width: 1; fill: none; }
      .wavefront { stroke: #2544FF; stroke-width: 1.4; fill: none; opacity: 0.8; }
      .pulse-ring { stroke: #38BDF8; stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: 0.6; }
      .vector-line { stroke: #38BDF8; stroke-width: 1.5; stroke-dasharray: 4 2; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Technical Header -->
  <g transform="translate(32, 24)">
    <text class="font-mono" x="0" y="0"><tspan fill="#2544FF">[ + ]</tspan> ARTIFACT // 03 &#160;•&#160; CRISIS TELEMETRY &amp; PACKET DISPERSAL</text>
    <text class="font-mono" x="816" y="0" text-anchor="end">PRALAYVEER &#160;•&#160; SIH '24 HACKATHON MVP</text>
  </g>
  <line x1="32" y1="34" x2="848" y2="34" stroke="#141822" stroke-width="1" />

  <!-- Abstract Crisis Topography & Beacon Wavefronts -->
  <g transform="translate(60, 40)">
    <!-- Central Emergency Locus Beacon -->
    <g transform="translate(400, 48)">
      <!-- Expanding Wavefronts -->
      <circle cx="0" cy="0" r="16" class="wavefront" />
      <circle cx="0" cy="0" r="32" class="pulse-ring" />
      <circle cx="0" cy="0" r="54" class="wavefront" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="82" class="pulse-ring" />
      <circle cx="0" cy="0" r="120" stroke="#172238" stroke-width="1" />
      <circle cx="0" cy="0" r="180" stroke="#121824" stroke-width="1" />
      <circle cx="0" cy="0" r="260" stroke="#0E131C" stroke-width="1" />

      <!-- Center Beacon Core -->
      <circle cx="0" cy="0" r="6" fill="#2544FF" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />

      <!-- Directional Dispersal Vectors (Guidance Paths) -->
      <line x1="0" y1="0" x2="-220" y2="-28" class="vector-line" />
      <line x1="0" y1="0" x2="240" y2="-20" class="vector-line" />
      <line x1="0" y1="0" x2="-180" y2="34" class="vector-line" />
      <line x1="0" y1="0" x2="210" y2="32" class="vector-line" />

      <!-- Target Node Waypoints -->
      <circle cx="-220" cy="-28" r="4" fill="#141A26" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="240" cy="-20" r="4" fill="#141A26" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="-180" cy="34" r="4" fill="#141A26" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="210" cy="32" r="4" fill="#141A26" stroke="#38BDF8" stroke-width="1.5" />
    </g>
  </g>

  <!-- Technical Footer Axis -->
  <line x1="32" y1="145" x2="848" y2="145" stroke="#141822" stroke-width="1" />
  <g transform="translate(32, 158)" class="font-mono">
    <text x="0" y="0">CONSTRAINTS: 24-HOUR SPRINT</text>
    <text x="408" y="0" text-anchor="middle">CLIENT PAYLOAD: ACCESSIBLE &amp; MINIMAL</text>
    <text x="816" y="0" text-anchor="end">TERRAIN ROUTING: CRITICAL PATHS</text>
  </g>
</svg>
