<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .card-bg {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
        rx: 10px;
        ry: 10px;
      }
      
      .metric-val {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      
      .metric-lbl {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: #8b949e;
      }

      .metric-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 11px;
        fill: #6e7681;
      }

      .pulse-cyan {
        animation: pulseC 4s ease-in-out infinite;
      }

      @keyframes pulseC {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.9; }
      }
    </style>
  </defs>

  <rect width="960" height="140" fill="#0d1117" />

  <!-- Metric 01: TurboIDM -->
  <g transform="translate(40, 15)">
    <rect width="205" height="110" class="card-bg pulse-cyan" stroke="#38bdf8" />
    <circle cx="28" cy="30" r="4" fill="#38bdf8" />
    <text x="38" y="33" class="metric-lbl">TURBOIDM</text>
    <text x="24" y="70" class="metric-val" fill="#38bdf8">8x FASTER</text>
    <text x="24" y="94" class="metric-sub">32 parallel chunk streams</text>
  </g>

  <!-- Metric 02: Inkless -->
  <g transform="translate(265, 15)">
    <rect width="205" height="110" class="card-bg pulse-cyan" stroke="#a855f7" />
    <circle cx="28" cy="30" r="4" fill="#a855f7" />
    <text x="38" y="33" class="metric-lbl">INKLESS</text>
    <text x="24" y="70" class="metric-val" fill="#c084fc">&lt; 5ms SAVE</text>
    <text x="24" y="94" class="metric-sub">Zero data loss offline sync</text>
  </g>

  <!-- Metric 03: Shivkush Nursery -->
  <g transform="translate(490, 15)">
    <rect width="205" height="110" class="card-bg pulse-cyan" stroke="#34d399" />
    <circle cx="28" cy="30" r="4" fill="#34d399" />
    <text x="38" y="33" class="metric-lbl">SHIVKUSH</text>
    <text x="24" y="70" class="metric-val" fill="#34d399">84% SMALLER</text>
    <text x="24" y="94" class="metric-sub">Google Draco 3D compression</text>
  </g>

  <!-- Metric 04: Visuals & Systems -->
  <g transform="translate(715, 15)">
    <rect width="205" height="110" class="card-bg pulse-cyan" stroke="#f59e0b" />
    <circle cx="28" cy="30" r="4" fill="#f59e0b" />
    <text x="38" y="33" class="metric-lbl">PERFORMANCE</text>
    <text x="24" y="70" class="metric-val" fill="#fbbf24">120 FPS</text>
    <text x="24" y="94" class="metric-sub">Fluid WebGL / Canvas runtime</text>
  </g>
</svg>
