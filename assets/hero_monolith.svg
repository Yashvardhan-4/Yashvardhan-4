<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      .bg { fill: #07080A; stroke: #1E232E; stroke-width: 1; rx: 14px; }
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      .name-primary { font-size: 42px; font-weight: 800; fill: #EDEDF0; letter-spacing: -0.04em; }
      .name-secondary { font-size: 42px; font-weight: 800; fill: #8E94A4; letter-spacing: -0.04em; }

      .coord-text { font-size: 10px; font-weight: 500; fill: #6B7280; letter-spacing: 0.12em; text-transform: uppercase; }
      .role-text { font-size: 11.5px; font-weight: 600; fill: #A5ABB9; letter-spacing: 0.12em; text-transform: uppercase; }
      .desc-text { font-size: 11.5px; font-weight: 400; fill: #606675; }

      .status-pill { fill: #0F1218; stroke: #202736; stroke-width: 1; rx: 11px; }

      .wave-1 {
        animation: waveSlide 5s linear infinite;
      }
      .wave-2 {
        animation: waveSlideReverse 7s linear infinite;
      }

      @keyframes waveSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-160px); }
      }
      @keyframes waveSlideReverse {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(0); }
      }

      .pulse-dot {
        animation: blink 2s ease-in-out infinite alternate;
      }
      @keyframes blink {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>

    <clipPath id="waveClip">
      <rect x="36" y="105" width="848" height="50" rx="4" />
    </clipPath>
  </defs>

  <!-- Obsidian Background Surface -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Top Metadata & Coordinates Bar -->
  <g transform="translate(40, 34)">
    <text class="font-mono coord-text" x="0" y="0">
      <tspan fill="#2544FF">[ + ]</tspan> SIGNAL // 01 &#160;•&#160; PUNE, IN &#160;•&#160; PCCOE CE '28
    </text>

    <text class="font-mono coord-text" x="840" y="0" text-anchor="end">
      18.5204° N, 73.8567° E &#160;•&#160; <tspan fill="#EDEDF0">CGPA 8.86</tspan>
    </text>
  </g>

  <!-- Hairline Axis -->
  <line x1="40" y1="48" x2="880" y2="48" stroke="#161B24" stroke-width="1" />

  <!-- Asymmetric Typographic Name -->
  <g transform="translate(40, 92)">
    <text class="font-sans name-primary" x="0" y="0">YASHVARDHAN</text>
    <text class="font-sans name-secondary" x="325" y="0">BORUDE</text>
  </g>

  <!-- The Living Harmonic Waveform (Tested, Valid XML, Fluid Keyframes) -->
  <g clip-path="url(#waveClip)">
    <line x1="36" y1="130" x2="884" y2="130" stroke="#151922" stroke-width="1" />

    <!-- Waveform Harmonic 2 -->
    <g class="wave-2">
      <path d="M -160 130 Q -120 114 -80 130 T 0 130 T 80 130 T 160 130 T 240 130 T 320 130 T 400 130 T 480 130 T 560 130 T 640 130 T 720 130 T 800 130 T 880 130 T 960 130 T 1040 130 T 1120 130 T 1200 130" 
            stroke="#1E283A" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />
    </g>

    <!-- Waveform Harmonic 1 -->
    <g class="wave-1">
      <path d="M 0 130 Q 40 116 80 130 T 160 130 T 240 130 T 320 130 T 400 130 T 480 130 T 560 130 T 640 130 T 720 130 T 800 130 T 880 130 T 960 130 T 1040 130 T 1120 130 T 1200 130" 
            stroke="#2544FF" stroke-width="1.8" fill="none" opacity="0.9" />
    </g>

    <circle cx="360" cy="130" r="2.5" fill="#2544FF" />
    <circle cx="520" cy="130" r="2.5" fill="#2544FF" />
    <circle cx="680" cy="130" r="2.5" fill="#2544FF" />
  </g>

  <!-- Lower Credible Identity & Runtime Dock -->
  <g transform="translate(40, 178)">
    <text class="font-mono role-text" x="0" y="0">
      SOFTWARE ENGINEER &amp; CREATIVE TECHNOLOGIST
    </text>
    <text class="font-sans desc-text" x="0" y="20">
      Student &amp; software builder exploring full-stack web systems, interactive 3D WebGL interfaces, and applied algorithms.
    </text>

    <!-- Live Status Pill -->
    <g transform="translate(710, -10)">
      <rect class="status-pill" width="130" height="22" />
      <circle class="pulse-dot" cx="14" cy="11" r="3" fill="#10B981" />
      <text class="font-mono coord-text" x="25" y="14" fill="#A5ABB9">RUNTIME: ACTIVE</text>
    </g>
  </g>
</svg>
