<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      
      .meta {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: #7d8590;
      }
      
      .hero-title {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-size: 68px;
        font-weight: 400;
        letter-spacing: -0.02em;
        fill: #f0f6fc;
      }
      
      .author {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: #c9d1d9;
      }
      
      .tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.6;
        fill: #8b949e;
      }

      .status-dot {
        fill: #3fb950;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .ambient-glow {
        animation: breath 8s ease-in-out infinite;
      }

      @keyframes breath {
        0%, 100% { opacity: 0.12; transform: scale(0.96); }
        50% { opacity: 0.22; transform: scale(1.04); }
      }
    </style>
    
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background matching GitHub Dark #0d1117 -->
  <rect width="960" height="320" fill="#0d1117" />

  <!-- Subtle Ambient Glow -->
  <ellipse class="ambient-glow" cx="480" cy="160" rx="360" ry="120" fill="url(#glowGrad)" />

  <!-- Top Metadata Rail -->
  <text x="40" y="44" class="meta">YASHVARDHAN BORUDE // SOFTWARE &amp; SYSTEMS</text>
  <circle cx="810" cy="40" r="3.5" class="status-dot" />
  <text x="822" y="44" class="meta">PUNE, INDIA</text>

  <!-- Editorial Top Hairline -->
  <line x1="40" y1="62" x2="920" y2="62" stroke="#30363d" stroke-width="1" stroke-opacity="0.6" />

  <!-- Display Hero -->
  <text x="40" y="145" class="hero-title">Curiosity, made tangible.</text>

  <!-- Author Moniker -->
  <text x="42" y="195" class="author">COMPUTER ENGINEERING · BUILDER · OPEN FOR COLLABORATION</text>

  <!-- Narrative Tagline -->
  <text x="42" y="235" class="tagline">I explore technology, experiment with ideas, and build software</text>
  <text x="42" y="258" class="tagline">that turns interesting problems into useful experiences.</text>

  <!-- Bottom Hairline with subtle diamond accent -->
  <line x1="40" y1="300" x2="920" y2="300" stroke="#30363d" stroke-width="1" stroke-opacity="0.6" />
  <text x="477" y="304" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">✦</text>
</svg>
