<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 68" width="100%" height="68">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&amp;display=swap');
      
      .pill-card {
        rx: 8px;
        ry: 8px;
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }
      
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        fill: #e6edf3;
      }

      .track {
        animation: scrollCarousel 24s linear infinite;
      }

      @keyframes scrollCarousel {
        0% { transform: translateX(0); }
        100% { transform: translateX(-2072px); }
      }

      .fade-left {
        fill: url(#fadeL);
      }
      .fade-right {
        fill: url(#fadeR);
      }
    </style>

    <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>

    <!-- Individual Authentic Tech Logos (20x20 Viewbox) -->
    <!-- 1. C++ -->
    <g id="logo-cpp">
      <polygon points="10,1 18,5.5 18,14.5 10,19 2,14.5 2,5.5" fill="#00599C" />
      <path d="M11 7.5a3 3 0 00-3 3v0a3 3 0 003 3" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M13 10.5h2m-1-1v2m2.5-1h2m-1-1v2" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- 2. JavaScript -->
    <g id="logo-js">
      <rect width="20" height="20" rx="3.5" fill="#F7DF1E" />
      <path d="M7 9v6.5c0 1.2-.6 1.8-1.7 1.8h-.8V16h.6c.4 0 .6-.2.6-.6V9H7zm4.2 0v5.2c0 .9.5 1.4 1.4 1.4.6 0 1.1-.3 1.3-.7l1 1c-.5.7-1.3 1.1-2.3 1.1-1.7 0-2.8-1-2.8-2.6V9h1.4z" fill="#000000" />
    </g>

    <!-- 3. TypeScript -->
    <g id="logo-ts">
      <rect width="20" height="20" rx="3.5" fill="#3178C6" />
      <path d="M4 6.5h6V8H7.8v7.5H6.2V8H4V6.5zm7.2 4.2c.6-.4 1.4-.6 2.2-.6 1.4 0 2.2.7 2.2 1.7 0 .8-.5 1.3-1.5 1.7l-.8.3c-.6.2-.9.5-.9.9 0 .4.4.6.9.6.6 0 1.1-.2 1.6-.6v1.6c-.6.3-1.3.4-2.1.4-1.6 0-2.4-.8-2.4-2 0-.8.6-1.5 1.6-1.8l.8-.3c.6-.2.9-.4.9-.7 0-.4-.4-.6-.8-.6-.6 0-1 .2-1.5.5v-1.6z" fill="#FFFFFF" />
    </g>

    <!-- 4. Python -->
    <g id="logo-python">
      <path d="M9.8 1.5c-2.4 0-4.3.7-4.3 2.5v2h4.5v.7H4.2C2.4 6.7 1 8.3 1 10.3s1.4 3.4 3.2 3.4h1.1v-1.6c0-1.8 1.6-3.3 3.5-3.3h4.4v-.8c0-1.8-1.9-2.5-3.4-2.5V1.5z" fill="#3776AB" />
      <circle cx="5" cy="4" r="0.75" fill="#FFFFFF" />
      <path d="M10.2 18.5c2.4 0 4.3-.7 4.3-2.5v-2h-4.5v-.7h5.8c1.8 0 3.2-1.6 3.2-3.6s-1.4-3.4-3.2-3.4h-1.1v1.6c0 1.8-1.6 3.3-3.5 3.3H6.8v.8c0 1.8 1.9 2.5 3.4 2.5v2z" fill="#FFD438" />
      <circle cx="15" cy="16" r="0.75" fill="#000000" />
    </g>

    <!-- 5. React 19 -->
    <g id="logo-react">
      <circle cx="10" cy="10" r="2.2" fill="#61DAFB" />
      <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(0 10 10)" />
      <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(60 10 10)" />
      <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#61DAFB" stroke-width="1.2" transform="rotate(120 10 10)" />
    </g>

    <!-- 6. Next.js 16 -->
    <g id="logo-next">
      <circle cx="10" cy="10" r="9" fill="#000000" stroke="#484f58" stroke-width="0.8" />
      <path d="M6.5 6v8h1.6V9.4l4.5 5.6h1.4V6h-1.6v4.6L7.9 6H6.5z" fill="#FFFFFF" />
    </g>

    <!-- 7. Three.js -->
    <g id="logo-three">
      <polygon points="10,2 18,17 2,17" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
      <polygon points="10,2 10,17 2,17" fill="#A855F7" fill-opacity="0.35" />
      <line x1="10" y1="2" x2="10" y2="17" stroke="#A855F7" stroke-width="1.2" />
      <line x1="10" y1="9.5" x2="18" y2="17" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- 8. Tailwind CSS -->
    <g id="logo-tailwind">
      <path d="M5.5 6c1.8-2 3.6-2 5.4 0 1.5 1.6 3 2.2 5.1 1.2-1.8 2-3.6 2-5.4 0-1.5-1.6-3-2.2-5.1-1.2zm-4 6c1.8-2 3.6-2 5.4 0 1.5 1.6 3 2.2 5.1 1.2-1.8 2-3.6 2-5.4 0-1.5-1.6-3-2.2-5.1-1.2z" fill="#38BDF8" />
    </g>

    <!-- 9. PostgreSQL -->
    <g id="logo-postgres">
      <path d="M10 2C6 2 3 5 3 9c0 3.2 2 6 5 6.8V19l3-2h1c4 0 7-3 7-7s-3-8-7-8zm-2 9a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="#336791" />
    </g>

    <!-- 10. Supabase -->
    <g id="logo-supabase">
      <path d="M11 2L3 11.5h6.5L8.5 19l8.5-9.5h-6.5L11 2z" fill="#3ECF8E" />
    </g>

    <!-- 11. MongoDB -->
    <g id="logo-mongo">
      <path d="M10 1c-3 4-4 8.5-1 13 1 1.5 2 2.5 3 2.5s2-1 3-2.5c3-4.5 2-9-1-13-.4-.7-.7-1.4-1-2-.3.6-.6 1.3-1 2z" fill="#47A248" />
      <line x1="10" y1="3" x2="10" y2="17" stroke="#2e6d2e" stroke-width="0.8" />
    </g>

    <!-- 12. Electron -->
    <g id="logo-electron">
      <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#9FEAF9" stroke-width="1.1" transform="rotate(30 10 10)" />
      <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#9FEAF9" stroke-width="1.1" transform="rotate(90 10 10)" />
      <ellipse cx="10" cy="10" rx="9" ry="3.5" fill="none" stroke="#9FEAF9" stroke-width="1.1" transform="rotate(150 10 10)" />
      <circle cx="10" cy="10" r="1.5" fill="#9FEAF9" />
    </g>

    <!-- 13. Docker -->
    <g id="logo-docker">
      <path d="M2 11h16c-.5 4-4 7-8 7s-7.5-3-8-7zm16-1c-.5-1.5-2-2-3-2-.5 0-1 .2-1.5.5V8h-2v2h-2V6H7v4H5V8H3v2H2v1h16v-1z" fill="#2496ED" />
      <rect x="5.5" y="6.5" width="1.5" height="1.5" fill="#FFFFFF" />
      <rect x="7.5" y="6.5" width="1.5" height="1.5" fill="#FFFFFF" />
      <rect x="7.5" y="4.5" width="1.5" height="1.5" fill="#FFFFFF" />
    </g>

    <!-- 14. Figma -->
    <g id="logo-figma">
      <rect x="4" y="2" width="6" height="5.3" rx="2.6" fill="#F24E1E" />
      <rect x="10" y="2" width="6" height="5.3" rx="2.6" fill="#FF7262" />
      <rect x="4" y="7.3" width="6" height="5.3" rx="2.6" fill="#A259FF" />
      <circle cx="13" cy="10" r="2.65" fill="#1ABCFE" />
      <path d="M4 12.6h3.4a2.65 2.65 0 012.65 2.65v0a2.65 2.65 0 01-2.65 2.65H4v-5.3z" fill="#0ACF83" />
    </g>

    <!-- The 14-Item Carousel Unit (Length: 14 * 148 = 2072px) -->
    <g id="carouselUnit">
      <!-- 1. C++ -->
      <g transform="translate(0, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-cpp" x="12" y="12" />
        <text x="40" y="27" class="pill-text">C++ 20</text>
      </g>
      <!-- 2. JavaScript -->
      <g transform="translate(148, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-js" x="12" y="12" />
        <text x="40" y="27" class="pill-text">JavaScript</text>
      </g>
      <!-- 3. TypeScript -->
      <g transform="translate(296, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-ts" x="12" y="12" />
        <text x="40" y="27" class="pill-text">TypeScript</text>
      </g>
      <!-- 4. Python -->
      <g transform="translate(444, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-python" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Python 3</text>
      </g>
      <!-- 5. React 19 -->
      <g transform="translate(592, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-react" x="12" y="12" />
        <text x="40" y="27" class="pill-text">React 19</text>
      </g>
      <!-- 6. Next.js 16 -->
      <g transform="translate(740, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-next" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Next.js 16</text>
      </g>
      <!-- 7. Three.js -->
      <g transform="translate(888, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-three" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Three.js</text>
      </g>
      <!-- 8. Tailwind CSS -->
      <g transform="translate(1036, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-tailwind" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Tailwind</text>
      </g>
      <!-- 9. PostgreSQL -->
      <g transform="translate(1184, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-postgres" x="12" y="12" />
        <text x="40" y="27" class="pill-text">PostgreSQL</text>
      </g>
      <!-- 10. Supabase -->
      <g transform="translate(1332, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-supabase" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Supabase</text>
      </g>
      <!-- 11. MongoDB -->
      <g transform="translate(1480, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-mongo" x="12" y="12" />
        <text x="40" y="27" class="pill-text">MongoDB</text>
      </g>
      <!-- 12. Electron -->
      <g transform="translate(1628, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-electron" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Electron</text>
      </g>
      <!-- 13. Docker -->
      <g transform="translate(1776, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-docker" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Docker</text>
      </g>
      <!-- 14. Figma -->
      <g transform="translate(1924, 12)">
        <rect width="134" height="44" class="pill-card" />
        <use href="#logo-figma" x="12" y="12" />
        <text x="40" y="27" class="pill-text">Figma</text>
      </g>
    </g>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="68" fill="#0d1117" />

  <!-- Infinite Looping Carousel Track (Unit duplicated back-to-back) -->
  <g class="track">
    <use href="#carouselUnit" x="0" />
    <use href="#carouselUnit" x="2072" />
  </g>

  <!-- Left & Right Gradient Fade Masks -->
  <rect x="0" y="0" width="70" height="68" class="fade-left" pointer-events="none" />
  <rect x="850" y="0" width="70" height="68" class="fade-right" pointer-events="none" />
</svg>