<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" height="110" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      
      .bg { fill: #0D0F12; stroke: #1F242D; stroke-width: 1; rx: 14px; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
      
      .stat-num { font-size: 27px; font-weight: 800; fill: #F4F4F6; letter-spacing: -0.02em; }
      .stat-label { font-size: 10px; font-weight: 600; fill: #7E8494; letter-spacing: 0.1em; text-transform: uppercase; }
      .stat-detail { font-size: 11px; font-weight: 500; }
      
      .accent-blue { fill: #455CE9; }
      .accent-emerald { fill: #10B981; }
      .accent-neutral { fill: #9CA3AF; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Column Dividers -->
  <line x1="230" y1="18" x2="230" y2="92" stroke="#1F242D" stroke-width="1" />
  <line x1="460" y1="18" x2="460" y2="92" stroke="#1F242D" stroke-width="1" />
  <line x1="690" y1="18" x2="690" y2="92" stroke="#1F242D" stroke-width="1" />

  <!-- Column 1: Algorithmic Problems -->
  <g transform="translate(32, 0)">
    <text class="font-sans stat-num" x="0" y="46">500+</text>
    <text class="font-mono stat-label" x="0" y="68">PROBLEMS SOLVED</text>
    <text class="font-mono stat-detail accent-blue" x="0" y="86">LeetCode • Codeforces • CodeChef</text>
  </g>

  <!-- Column 2: Academic Standing -->
  <g transform="translate(262, 0)">
    <text class="font-sans stat-num" x="0" y="46">8.86</text>
    <text class="font-mono stat-label" x="0" y="68">ACADEMIC CGPA</text>
    <text class="font-mono stat-detail accent-neutral" x="0" y="86">PCCOE Pune • Computer Eng '28</text>
  </g>

  <!-- Column 3: Competitive Standing -->
  <g transform="translate(492, 0)">
    <text class="font-sans stat-num" x="0" y="46">2★ / Pupil</text>
    <text class="font-mono stat-label" x="0" y="68">COMPETITIVE STANDING</text>
    <text class="font-mono stat-detail accent-blue" x="0" y="86">CodeChef (1434) • CF (1227)</text>
  </g>

  <!-- Column 4: IIT Certification -->
  <g transform="translate(722, 0)">
    <text class="font-sans stat-num" x="0" y="46">Elite + Silver</text>
    <text class="font-mono stat-label" x="0" y="68">IIT NPTEL CERTIFIED</text>
    <text class="font-mono stat-detail accent-emerald" x="0" y="86">Graph Theory &amp; DSA (77%)</text>
  </g>
</svg>
