<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="170" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .font-mono { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #525866; letter-spacing: 0.14em; text-transform: uppercase; }
      .bg { fill: #07080A; stroke: #181D26; stroke-width: 1; rx: 12px; }
      .iso-line { stroke: #151A24; stroke-width: 1; }
      .proj-line { stroke: #2544FF; stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.6; }
      .wire { stroke: #38BDF8; stroke-width: 1.4; fill: rgba(56, 189, 248, 0.04); }
      .wire-accent { stroke: #2544FF; stroke-width: 1.6; fill: rgba(37, 68, 255, 0.12); }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Technical Header -->
  <g transform="translate(32, 24)">
    <text class="font-mono" x="0" y="0"><tspan fill="#2544FF">[ + ]</tspan> ARTIFACT // 02 &#160;•&#160; SPATIAL 3D &amp; RELATIONAL PLANE</text>
    <text class="font-mono" x="816" y="0" text-anchor="end">SHIVKUSH SNMS &#160;•&#160; THREE.JS &amp; SUPABASE</text>
  </g>
  <line x1="32" y1="34" x2="848" y2="34" stroke="#141822" stroke-width="1" />

  <!-- Abstract Spatial & Database Plane Visualization -->
  <g transform="translate(60, 40)">
    <!-- Planar Relational Isometric Grid (The Database Plane) -->
    <g transform="translate(420, 20)">
      <!-- Isometric Ground Plane -->
      <polygon points="0,40 180,75 360,40 180,5" fill="#090C12" stroke="#1C2433" stroke-width="1" />
      
      <!-- Grid subdivisions -->
      <line x1="90" y1="22.5" x2="270" y2="57.5" stroke="#141B26" stroke-width="1" />
      <line x1="90" y1="57.5" x2="270" y2="22.5" stroke="#141B26" stroke-width="1" />
      <line x1="180" y1="5" x2="180" y2="75" stroke="#141B26" stroke-width="1" />
      <line x1="0" y1="40" x2="360" y2="40" stroke="#141B26" stroke-width="1" />

      <!-- Active Database Record Markers on the Plane -->
      <circle cx="180" cy="40" r="4.5" fill="#10B981" />
      <circle cx="180" cy="40" r="2" fill="#FFFFFF" />
      <circle cx="120" cy="30" r="3.5" fill="#1E2A42" stroke="#2544FF" stroke-width="1.5" />
      <circle cx="240" cy="50" r="3.5" fill="#1E2A42" stroke="#2544FF" stroke-width="1.5" />
      <circle cx="240" cy="30" r="3" fill="#151C28" stroke="#38BDF8" stroke-width="1" />

      <!-- RLS Security Boundary Ring on Plane -->
      <ellipse cx="180" cy="40" rx="90" ry="24" stroke="#2544FF" stroke-width="1" fill="none" stroke-dasharray="3 3" opacity="0.7" />
    </g>

    <!-- 3D Spatial Wireframe Geometry (The Three.js Model) Hovering in Space -->
    <g transform="translate(180, 15)">
      <!-- Volumetric Polyhedron / Plant-like Wireframe Lattice -->
      <!-- Center Stem -->
      <line x1="90" y1="85" x2="90" y2="10" stroke="#38BDF8" stroke-width="1.8" />
      
      <!-- Spatial facets -->
      <polygon points="90,10 40,40 90,55 140,40" class="wire-accent" />
      <polygon points="90,30 30,65 90,80 150,65" class="wire" />
      
      <!-- Nodes / Vertices -->
      <circle cx="90" cy="10" r="3.5" fill="#FFFFFF" />
      <circle cx="40" cy="40" r="3" fill="#38BDF8" />
      <circle cx="140" cy="40" r="3" fill="#38BDF8" />
      <circle cx="30" cy="65" r="3" fill="#2544FF" />
      <circle cx="150" cy="65" r="3" fill="#2544FF" />
      <circle cx="90" cy="85" r="4" fill="#10B981" />

      <!-- Orthogonal Downward Projection Vectors to the Relational Plane -->
      <line x1="90" y1="85" x2="420" y2="60" class="proj-line" />
      <line x1="150" y1="65" x2="480" y2="50" class="proj-line" />
      <line x1="30" y1="65" x2="360" y2="70" class="proj-line" />
    </g>
  </g>

  <!-- Technical Footer Axis -->
  <line x1="32" y1="145" x2="848" y2="145" stroke="#141822" stroke-width="1" />
  <g transform="translate(32, 158)" class="font-mono">
    <text x="0" y="0">PROJECTION: ORTHOGRAPHIC 3D</text>
    <text x="408" y="0" text-anchor="middle">RELATIONAL CONSTRAINTS: ROW-LEVEL SECURITY</text>
    <text x="816" y="0" text-anchor="end">DATA PROTOCOL: REALTIME PWA</text>
  </g>
</svg>
