<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 40" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;display=swap');
      
      .title {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: #8b949e;
      }

      .snake-head {
        fill: #39d353;
        animation: creep 2s infinite alternate;
      }

      @keyframes creep {
        0% { transform: translateX(0); }
        100% { transform: translateX(6px); }
      }
    </style>
  </defs>

  <rect width="920" height="40" fill="#0d1117" />
  
  <line x1="16" y1="20" x2="80" y2="20" stroke="#30363d" stroke-width="1" />
  <g class="snake-head">
    <rect x="14" y="16" width="8" height="8" rx="2" fill="#39d353" />
    <rect x="24" y="16" width="8" height="8" rx="2" fill="#26a641" />
  </g>
  
  <text x="95" y="24" class="title">CONTRIBUTION GRID ANIMATION // SNK AUTOMATION ENGINE</text>
  <line x1="570" y1="20" x2="904" y2="20" stroke="#30363d" stroke-width="1" />
</svg>
